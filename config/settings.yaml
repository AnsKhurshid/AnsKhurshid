# Job-search agent configuration.
# Secrets (API keys) do NOT belong here; put them in .env (see .env.example).
# Relative paths resolve against the project root.

profile:
  master_resume_path: data/resume/master_resume.docx   # .docx or .pdf; never modified
  candidate_profile_path: data/profile/candidate_profile.yaml  # extracted, user-reviewed profile

search:
  preferred_titles:          # priority order: earlier = stronger career alignment
    - Data Engineer
    - AWS Data Engineer
    - ETL Developer
    - ETL Engineer
    - Python Data Engineer
    - SQL Data Engineer
    - Analytics Engineer
    - Data Integration Engineer
  primary_country: Pakistan
  preferred_locations: [Lahore, Karachi, Islamabad, Rawalpindi, Faisalabad, Multan, Peshawar]
  work_arrangements: [on-site, hybrid, remote]
  include_international_remote: false   # only after local roles are processed
  posted_within_days: 14                # used for generated search links
  min_experience_years: 0
  max_experience_years: 5               # roles requiring more than this get a seniority penalty
  candidate_experience_years: null      # null = derive from the reviewed profile
  preferred_industries: []
  excluded_industries: []
  excluded_title_keywords: [intern, internship, principal, director, head of, vp ]
  frequency: weekly                     # informational until scheduling is added
  max_jobs_per_run: 200

sources:
  enabled: [linkedin, manual]
  linkedin:
    geo_id_pakistan: "101022442"
    inbox_dir: data/inbox/linkedin      # drop saved job pages (.html), url lists (.txt) here
  manual:
    inbox_dir: data/inbox/manual        # .csv / .json / .txt job files
  url_fetch:
    enabled: true                       # only fetches URLs whose robots.txt allows it
    user_agent: "jobagent-personal/0.1 (+local personal use)"
    min_interval_seconds: 5
    timeout_seconds: 20
    max_retries: 3

matching:
  min_match_score: 65                   # shortlist threshold
  weights:                              # must sum to 100
    skills: 30
    responsibilities: 25
    seniority: 15
    role_alignment: 15
    location: 10
    domain: 5
  categories:                           # lower bounds, inclusive
    strong: 80
    potential: 65
    stretch: 50
  use_ai: true                          # ignored when no provider/key is configured
  candidate_domains: [real estate, proptech]

resume:
  output_dir: data/resumes
  generate_pdf: true                    # requires LibreOffice (soffice) on PATH
  ai_rewrite_bullets: false             # deterministic tailoring by default; AI rewrite is validated
  max_bullets_per_role: 6

reporting:
  output_dir: data/reports
  min_sample_for_trends: 10             # below this, market insights are labelled "small sample"

ai:
  provider: none                        # none | anthropic | openai
  model: ""                             # e.g. a current Claude or GPT model id
  max_tokens: 2000
  timeout_seconds: 60
  max_retries: 3
  # USD per million tokens, for cost estimates; leave 0 if unknown.
  input_cost_per_mtok: 0
  output_cost_per_mtok: 0

storage:
  db_path: data/jobagent.db

logging:
  dir: data/logs
  level: INFO
