  Amazon EMR: {category: processing, aliases: [emr, elastic mapreduce], implies: [AWS, Apache Spark]}
  Amazon Kinesis: {category: streaming, aliases: [kinesis, kinesis data streams, firehose], implies: [AWS, Data Streaming], equivalent: [Apache Kafka]}
  Amazon EC2: {category: cloud, aliases: [ec2], implies: [AWS]}
  Amazon CloudWatch: {category: cloud, aliases: [cloudwatch], implies: [AWS, Monitoring]}
  Amazon SQS: {category: cloud, aliases: [sqs], implies: [AWS]}
  Amazon SNS: {category: cloud, aliases: [sns], implies: [AWS]}
  AWS IAM: {category: cloud, aliases: [iam], implies: [AWS]}
