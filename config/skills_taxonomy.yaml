# Canonical skills used for matching. Edit freely.
#   aliases:     alternative spellings / synonyms (matched case-insensitively on word boundaries)
#   case_sensitive_aliases: short tokens that are only meaningful in a given case (e.g. "R")
#   implies:     broader skills this one demonstrates (AWS Lambda => AWS). Full credit for the broader skill.
#   equivalent:  near-substitutes; partial credit (default 0.7) as a transferable skill
#   related:     adjacent skills; small partial credit (default 0.35) as a transferable skill
#   context_only: true = never matched unless written exactly (avoids false positives)

credit:
  equivalent: 0.7
  related: 0.35

skills:
  # ---------------------------------------------------------------- languages
  Python: {category: language, aliases: [python3, "python 3"]}
  SQL: {category: language, aliases: ["structured query language", "t-sql", tsql, "pl/sql", plsql, "ansi sql"]}
  Scala: {category: language, related: [Java, Python]}
  Java: {category: language, related: [Scala]}
  Bash: {category: language, aliases: [shell scripting, "shell script", "unix shell", "linux shell"]}
  R: {category: language, case_sensitive_aliases: ["R"], context_only: true}
  Go: {category: language, aliases: [golang], context_only: true}

  # ---------------------------------------------------------------- databases
  PostgreSQL: {category: database, aliases: [postgres, postgresql, psql], implies: [SQL, Relational Databases], equivalent: [MySQL, Microsoft SQL Server, Amazon Aurora], related: [Amazon Redshift]}
  MySQL: {category: database, aliases: [mariadb], implies: [SQL, Relational Databases], equivalent: [PostgreSQL, Microsoft SQL Server]}
  Microsoft SQL Server: {category: database, aliases: [sql server, mssql, ms sql, "ms-sql"], implies: [SQL, Relational Databases], equivalent: [PostgreSQL, MySQL]}
  Oracle Database: {category: database, aliases: [oracle db, "oracle database"], implies: [SQL, Relational Databases], equivalent: [PostgreSQL, Microsoft SQL Server]}
  Amazon RDS: {category: cloud, aliases: [aws rds, rds], implies: [AWS, Relational Databases]}
  Amazon Aurora: {category: cloud, aliases: [aurora], implies: [AWS, Relational Databases], equivalent: [PostgreSQL, MySQL]}
  Relational Databases: {category: concept, aliases: [rdbms, relational database, relational databases]}
  MongoDB: {category: database, aliases: [mongo], implies: [NoSQL]}
  Amazon DynamoDB: {category: cloud, aliases: [dynamodb], implies: [AWS, NoSQL]}
  Cassandra: {category: database, aliases: [apache cassandra], implies: [NoSQL]}
  Redis: {category: database}
  NoSQL: {category: concept, aliases: [nosql databases, "no-sql"]}
  Elasticsearch: {category: database, aliases: [elastic search, opensearch]}

  # ---------------------------------------------------------------- warehouses / lakes
  Amazon Redshift: {category: warehouse, aliases: [redshift, aws redshift], implies: [AWS, Data Warehousing], equivalent: [Snowflake, Google BigQuery, Azure Synapse], related: [PostgreSQL]}
  Snowflake: {category: warehouse, implies: [Data Warehousing], equivalent: [Amazon Redshift, Google BigQuery, Azure Synapse, Databricks]}
  Google BigQuery: {category: warehouse, aliases: [bigquery, big query], implies: [GCP, Data Warehousing], equivalent: [Snowflake, Amazon Redshift]}
  Azure Synapse: {category: warehouse, aliases: [synapse analytics, azure synapse analytics], implies: [Azure, Data Warehousing], equivalent: [Snowflake, Amazon Redshift]}
  Databricks: {category: processing, aliases: [azure databricks], implies: [Apache Spark], equivalent: [Snowflake]}
  Data Warehousing: {category: concept, aliases: [data warehouse, data warehouses, data warehousing, dwh, edw, enterprise data warehouse]}
  Data Lake: {category: concept, aliases: [data lakes, lakehouse, data lakehouse, delta lake]}
  Data Modeling: {category: concept, aliases: [data modelling, dimensional modeling, dimensional modelling, star schema, snowflake schema, kimball, data vault]}

  # ---------------------------------------------------------------- AWS
  AWS: {category: cloud, aliases: [amazon web services, aws cloud], equivalent: [Azure, GCP]}
  AWS Lambda: {category: cloud, aliases: [lambda, lambda functions, "aws lambda", "lambda function", serverless functions], implies: [AWS, Serverless], equivalent: [Azure Functions, Google Cloud Functions]}
  AWS Step Functions: {category: orchestration, aliases: [step functions, step function, "aws step function", sfn], implies: [AWS, Workflow Orchestration], related: [Apache Airflow, Azure Data Factory]}
  Amazon S3: {category: cloud, aliases: [s3, aws s3, "s3 buckets"], implies: [AWS], equivalent: [Azure Blob Storage, Google Cloud Storage]}
  AWS Glue: {category: processing, aliases: [glue jobs, glue catalog, "aws glue"], implies: [AWS, ETL], related: [AWS Lambda, Apache Spark, Azure Data Factory]}
